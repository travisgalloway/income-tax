_comment: 'Curated snapshots. NEVER machine-written.

  These four datasets are NOT auto-fetchable: IRS SOI and OECD Revenue Statistics are

  published as documents, and the debt holder/maturity figures are assembled from

  several Treasury releases plus the discrepancy resolutions in discrepancies.yaml.

  They are refreshed by hand. The pipeline stamps each with the as_of date already in

  the data so a stale snapshot is visible in the UI rather than silently current.

  IMPORTANT: Federal Reserve holdings are deliberately ABSENT from debt_holders.

  See discrepancies.yaml -> federal_reserve_holdings. Do not add them.'
