_comment: 'Curated snapshots. NEVER machine-written.

  Four of these five outputs are NOT auto-fetchable: IRS SOI, OECD Revenue Statistics

  and the CBO distribution tables publish as documents, and the debt maturity figures

  are assembled from several Treasury releases. They are refreshed by hand, and the

  pipeline stamps each with the as_of date already in the data so a stale snapshot is

  visible in the UI rather than silently current.

  debt_holders is the exception since #54 and is built by monthly/debt_holders.py, not

  by curated_snapshots.py: its foreign holdings are FETCHED from Treasury International

  Capital at the release month pinned below as tic_vintage. Everything else under it is

  still curated, which is why that output carries refresh.mode "mixed" and two dates.

  Moving tic_vintage is an editorial act: TIC revises monthly, and adopting a newer

  release changes published figures. Do not bump it to make a drift report go away.

  IMPORTANT: Federal Reserve holdings are deliberately ABSENT from debt_holders.

  See discrepancies.yaml -> federal_reserve_holdings. Do not add them. The MFH table

  carries no Federal Reserve row, and lib/tic.py reads three countries and the grand

  total only, so the fetch gives no route back in.'
snapshots:
  debt_holders:
    total_debt_t: 39.88
    as_of: '2026-08-07'
    # The pinned Treasury International Capital release month. The country
    # holdings block is FETCHED from this column of the Major Foreign Holders
    # table and must not be written here; monthly/debt_holders.py refuses to
    # build if a curated copy of it reappears under this key.
    tic_vintage: '2025-11'
    split:
    - k: public
      label: Held by the public
      amount_t: 32.14
      share_pct: 80.6
    - k: intragov
      label: Intragovernmental holdings
      amount_t: 7.74
      share_pct: 19.4
    public_split:
    - k: domestic
      label: Domestic holders
      share_of_public_pct: 70
    - k: foreign
      label: Foreign holders
      share_of_public_pct: 30
    foreign_share_history:
    - year: 1970
      share_of_gross_pct: 5
    - year: 2025
      share_of_gross_pct: 24
  debt_maturity:
    avg_maturity_months: 71
    avg_maturity_as_of: 2026-06
    longest_instrument_years: 30
    # The MSPD statement month, pinned by hand (#56). monthly/debt_maturity.py
    # fetches Table 1 for exactly this month and fails if it is absent; it never
    # adopts whatever Treasury published most recently. Moving this line is an
    # editorial change to three published figures and the marketable total, so
    # it is a decision, not a refresh.
    mspd_vintage: 2026-05
    # No marketable_total_t and no amount_t here: both come from MSPD. The
    # curated copies read 28.0 / 6.8 / 15.9 / 5.4, and 28.0 was bills + notes +
    # bonds wearing the marketable total's label (#56).
    composition:
    - k: bills
      label: Bills
      maturity: under 1 year
      share_pct: 22
    - k: notes
      label: Notes
      maturity: 2 to 10 years
    - k: bonds
      label: Bonds
      maturity: 20 to 30 years
    history_months:
    - date: 2023-05
      v: 75
    - date: 2025-06
      v: 72
    - date: 2025-12
      v: 70
    - date: 2026-06
      v: 71
  income_tax_by_group:
    tax_year: 2023
    groups:
    - g: Top 1%
      income_share_pct: 20.6
      tax_share_pct: 38.4
      avg_rate_pct: 26.3
    - g: Top 5%
      tax_share_pct: 60.0
    - g: Top 10%
      income_share_pct: 47.6
      tax_share_pct: 70.5
    - g: Top 25%
      tax_share_pct: 86.3
    - g: Top 50%
      income_share_pct: 87.7
      tax_share_pct: 96.7
    - g: Bottom 50%
      tax_share_pct: 3.3
      avg_rate_pct: 3.7
    top1_tax_share_history:
    - year: 2001
      v: 33.2
    - year: 2019
      v: 38.8
    - year: 2021
      v: 45.8
    - year: 2022
      v: 40.4
    - year: 2023
      v: 38.4
    cbo_top1_income_share:
    - year: 1979
      v: 9
    - year: 2022
      v: 18
  oecd:
    year: 2024
    us_pct_gdp: 25.6
    oecd_average_pct_gdp: 34.1
    us_rank: 31
    of_countries: 38
    countries:
    - c: Denmark
      v: 45.2
    - c: Italy
      v: 42.8
    - c: Germany
      v: 38.0
    - c: United Kingdom
      v: 34.4
    - c: OECD average
      v: 34.1
      is_average: true
    - c: Czechia
      v: 34.0
    - c: Lithuania
      v: 33.1
    - c: Switzerland
      v: 27.2
    - c: United States
      v: 25.6
      is_us: true
    - c: Ireland
      v: 21.7
    - c: Mexico
      v: 18.3
    us_history:
    - year: 2000
      v: 28.3
    - year: 2009
      v: 22.9
    - year: 2022
      v: 27.6
    - year: 2023
      v: 25.2
    - year: 2024
      v: 25.6
  cbo_effective_rates:
    as_of: '2026-01-15'
    basis: >-
      Average federal tax rate: individual income tax, payroll (social insurance) tax,
      corporate income tax and excise tax combined, as a share of income before means-tested
      transfers and federal taxes. INCLUDES PAYROLL TAX, so this is not comparable to the
      income-tax-only shares in income_tax_by_group.
    not_an_annual_series: >-
      Published anchor years only, each transcribed from the report's own table for that
      year's Distribution of Household Income vintage. Never chart these as a continuous
      line; the years between them are not observed.
    groups: [lowest, second, middle, fourth, highest, top1]
    rows:
    - year: 1979
      source_table: 'CBO, The Distribution of Household Income, 2022 (Jan 2026), Supplemental
        Data Table 9: Average Federal Tax Rates, by Income Group, 1979 to 2022'
      v: {lowest: 9.3, second: 15.0, middle: 19.1, fourth: 21.7, highest: 27.1, top1: 35.1}
    - year: 2000
      source_table: 'CBO, The Distribution of Household Income, 2022 (Jan 2026), Supplemental
        Data Table 9: Average Federal Tax Rates, by Income Group, 1979 to 2022'
      v: {lowest: 7.2, second: 13.3, middle: 17.1, fourth: 21.0, highest: 27.8, top1: 32.2}
    - year: 2007
      source_table: 'CBO, The Distribution of Household Income, 2022 (Jan 2026), Supplemental
        Data Table 9: Average Federal Tax Rates, by Income Group, 1979 to 2022'
      v: {lowest: 4.9, second: 11.2, middle: 14.8, fourth: 18.1, highest: 24.8, top1: 28.2}
    - year: 2019
      source_table: 'CBO, The Distribution of Household Income, 2022 (Jan 2026), Supplemental
        Data Table 9: Average Federal Tax Rates, by Income Group, 1979 to 2022'
      v: {lowest: 0.6, second: 8.9, middle: 13.0, fourth: 16.8, highest: 24.3, top1: 30.0}
    - year: 2022
      source_table: 'CBO, The Distribution of Household Income, 2022 (Jan 2026), Supplemental
        Data Table 9: Average Federal Tax Rates, by Income Group, 1979 to 2022'
      v: {lowest: 1.4, second: 9.5, middle: 13.4, fourth: 17.6, highest: 25.9, top1: 31.5}
