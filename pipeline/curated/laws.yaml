_comment: 'Curated. NEVER machine-written. 23 major deficit-moving laws since 1995.

  score_t is the ten-year cost AS ESTIMATED AT ENACTMENT, not as realised.

  PL 105-33 and 105-34 predate the ten-year convention and carry score_t: null;

  they must be excluded from cost totals but still carry vote splits.

  verified_* on PL 115-97 is [party_yea, party_nay] for [R..., D...] and is the

  regression target for the Voteview join.

  rollcall gives the FINAL PASSAGE vote per chamber, selected by hand. A bill has

  many roll calls (TCJA alone has five in the House) and picking by date is wrong.

  A null chamber means NO ROLL CALL EXISTS, usually a voice vote. That is missing

  data, never unanimity, and must not be rendered as a vote.'
