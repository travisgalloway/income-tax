_comment: |
  Curated. NEVER machine-written.
  Every figure QUOTED IN PROSE in content/sections.md, mapped to the generated
  field it came from. On each run the pipeline recomputes these and reports any
  that have moved.

  This exists because a CBO revision does not touch the prose. Without it, a
  vintage change silently leaves "$223 billion" sitting in section 7 while the
  chart beside it shows something else. Drift here is an EDITORIAL event: it is
  reported, not auto-corrected, and it does not fail the build. The load-bearing
  invariants that MUST fail the build live in lib/validate.py instead.

  resolver grammar:
    output   which src/data/*.json file
    year     a single fiscal/tax year, selecting one row
    field    field on that row
    agg      sum | mean | min_year | count_positive, over `years: [first, last]`
    path     dotted path into _meta or a non-tabular data blob
    quoted   the number as it currently appears in the prose
    tol      absolute tolerance before it is reported as drift

