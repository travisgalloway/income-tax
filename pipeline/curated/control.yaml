_comment: 'Curated. NEVER machine-written. Party control of the presidency, House and

  Senate by fiscal year, from CRS and chamber historical records.

  control: D or R if unified, M if split.

  ATTRIBUTION RULE: each fiscal year is assigned to whoever held the office in

  JUNE of that fiscal year. FY2025 therefore belongs to Trump II, not Biden.

  Coverage is FY1995-FY2025. Budget series run to FY1962; charts must show the

  control strip only where control data exists, never a blank implying unknown.'
