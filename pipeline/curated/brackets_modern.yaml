_comment: >-
  Curated. NEVER machine-written.
  The Tax Foundation income-tax-rates CSV (bracket_history.py's fetched source)
  ends at tax year 2019. 2020-2025 have no fetchable source, so they are
  transcribed by hand from the IRS Revenue Procedure that sets each year's TCJA
  inflation adjustments, cross-checked against Tax Foundation's published
  "20XX Tax Brackets" pages. 2019 is included here TOO, but only as a
  REGRESSION YEAR: the fetched CSV stays authoritative for 2019, and
  bracket_history.py raises if this transcription does not reproduce the CSV
  exactly on (rate, lo, hi) for all four filing statuses.
  Each `ceilings` list is the upper edge of each bracket in `rate_ladder` order,
  i.e. the "not over" threshold from the Revenue Procedure; the last entry is
  always null (open-ended top bracket). The builder derives each bracket's
  floor as the previous bracket's ceiling plus one dollar, matching the
  convention the fetched CSV already uses for modern years.
rate_ladder: [0.10, 0.12, 0.22, 0.24, 0.32, 0.35, 0.37]
years:
  2019:
    source: IRS Rev. Proc. 2018-57 (2019 inflation adjustments)
    ceilings:
      single: [9700, 39475, 84200, 160725, 204100, 510300, null]
      mfj: [19400, 78950, 168400, 321450, 408200, 612350, null]
      mfs: [9700, 39475, 84200, 160725, 204100, 306175, null]
