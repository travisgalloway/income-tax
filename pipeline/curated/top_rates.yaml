_comment: |-
  Curated. NEVER machine-written.
  Top STATUTORY marginal federal individual income tax rate on ORDINARY income,
  tax years 1913-2025.
  Source: IRS SOI Historical Table 23 for 1913-2018, corroborated year by year
  against curated/top_rates_soi_anchor.yaml (Table 23's own highest-bracket
  column, transcribed with its SHA-256) by validate.check_top_rates_anchor --
  all 106 years agree to the digit, and the check fails the build if that ever
  stops being true. PL 115-97 and IRS Revenue Procedures 2018-57 through 2024-40
  for 2019-2025, which is past where Table 23 ends; those schedules are
  transcribed in curated/brackets_modern.yaml.
  TRAPS:
    - Statutory is not effective. Nobody pays this rate on their whole income, and
      the income threshold it applies at has moved enormously. A chart of this line
      alone invites a causal reading it cannot support.
    - Ordinary income only. Capital gains have been taxed at separate, usually
      lower, rates for most of this period.
    - Surtaxes are INCLUDED in the published figure for 1940 (a defense-preparedness
      surtax) and for 1968-1970 (the Vietnam-era income tax surtax), which is why
      those years read higher than the plain bracket-schedule ladder. Every other
      year EXCLUDES surtaxes. See pipeline/curated/bracket_adjustments.yaml for the
      full list of years where the published figure diverges from the schedule top.
    - Excludes the alternative minimum tax, the phase-out of exemptions and
      deductions, and the 3.8% net investment income tax from 2013.
    - 1981 shows 69.125%, the blended rate after a part-year cut.
