_comment: 'Curated editorial metadata, lifted verbatim from the hand-checked JSON files.

  NEVER machine-written. Every `notes` entry documents a trap that a chart can

  silently violate: mandatory is gross, the Gini is families not households, the

  income-tax shares exclude payroll tax. `source` is rendered VERBATIM in the UI

  per BRIEF.md rule 1 and must never be summarised to "CBO data".


  `title` may carry `{key}` placeholders, which emit.expand_title fills from the

  emitted `_meta.coverage` (`{start}`, `{control_start}`, `{mhi[start]}`). Write a year

  range as a placeholder, never as a literal: a hand-typed range does not follow the

  series when it is extended, and check_meta_titles fails the build if one drifts (#41).'
outputs:
  budget:
    title: Federal outlays, revenue, deficit and major legislation, FY{start}-FY{end}, with party
      control FY{control_start}-FY{control_end}
    source: CBO Historical Budget Data (Feb 2026); CBO Historical Economic Data (Feb 2026) for the
      GDP price index; CBO and JCT cost estimates; CRS and chamber records for party control
    units:
      n_*: nominal $ trillions
      r_*: real $ trillions, FY2025 dollars, GDP price index
      g_*: percent of GDP
    fields:
      y: fiscal year
      ma: mandatory outlays, gross
      or: offsetting receipts (negative)
      di: discretionary outlays
      ni: net interest
      re: revenues
      de: deficit (negative) or surplus
      ot: total outlays
      pp: president's party
      h: House majority party
      s: Senate majority party
      ctl: D/R if unified, M if split
      t: handoff year
      p: president
      L: 'major laws enacted that fiscal year: n name, a public law, v ten-year score $T (positive
        = adds to deficit), c vote character, rollcall counted per-party split, legacy_comp the
        retired PLR/PLD/XP classification (never read), date, pres, cfg control at enactment'
    notes:
    - Mandatory is gross; add 'or' to get the net figure used in charts, so ma+or+di+ni = ot.
    - 'Vote composition is COUNTED, not classified: per-party final-passage splits for all 23 laws
      come from Voteview roll calls, carried in party_splits.json and joined on public_law. See
      SOURCES.md.'
    - FY2025 is attributed to Trump II under the June-of-fiscal-year rule.
    - 'Series now run FY1962-FY2025. Party control is curated and covers FY1995-FY2025 only; years
      outside that range carry control: null and must not render a control strip.'
  debt:
    title: Total public debt outstanding at fiscal year end, FY{start}-FY{end}
    source: US Treasury, Historical Debt Outstanding and Debt to the Penny. GDP denominator from
      CBO Historical Budget Data, Feb 2026
    units:
      debt: nominal $ trillions
      gdp_share: gross debt as percent of GDP
    notes:
    - FY2026 value is the close of 18 August 2026, the first Debt to the Penny close at or above
      $40T, reported the following day; not a fiscal year-end close, and gdp_share is null because
      FY2026 GDP is not final.
    - FY2016 $19.57T to $40T is a 2.04x rise in ten fiscal years. FY2005 to FY2015 was 2.29x, a faster
      doubling from a smaller base.
  debt_holders:
    title: Who holds the federal debt
    source: US Treasury Debt to the Penny (public vs intragovernmental, 7 Aug 2026); Treasury International
      Capital, Major Foreign Holders of Treasury Securities (foreign holdings, November 2025)
    notes:
    - Foreign holders are about 30% of publicly held debt. That is about $9.6T of the $32.14T held
      by the public, which is 24% of the $39.88T gross. A 32% figure is the share of publicly held
      debt wearing the gross label; the two denominators are not interchangeable.
    - Treasury International Capital is revised monthly and the release month is part of the figure.
      This dataset pins the November 2025 release, where China reads $683.9B; the same series reads
      $760.8B for January 2025.
    - Federal Reserve holdings are reported between $4.53T and $4.9T across sources; omitted rather
      than pick one.
  debt_maturity:
    title: Maturity structure of marketable Treasury debt
    source: Treasury Monthly Statement of the Public Debt; Joint Economic Committee monthly debt
      update (Jun 2026 average maturity); Peter G Peterson Foundation for instrument shares
    notes:
    - The 30-year bond is the longest instrument issued, so nothing outstanding today was issued
      before 1996.
    - But average maturity is about 71 months, roughly six years. Roughly a third of debt matures
      within twelve months.
    - This is why rate rises after 2021 repriced the whole stock within a few years. It is the causal
      link to the net interest chart.
    - Savings bonds (Series EE and I) reach final maturity at 20-30 years and are non-marketable;
      excluded from these figures.
    - Bills, notes and bonds are the three instrument families and their amounts do not sum exactly
      to the $28.0T marketable total; they are not an exhaustive partition. The bills share_pct
      (22) is the curated figure and disagrees with amount_t / marketable_total_t (24.3); geometry
      comes from amount_t, the percentage only from this curated field.
    - history_months is a four-point maturity time series and is deliberately NOT charted.
      sections.md is explicit that this section is not built as a time series; the field is kept
      in the data for reference but no component may reference it.
  revenue_sources:
    title: Federal revenue by source, FY{start} onward
    source: CBO Historical Budget Data, February 2026 vintage
    units:
      n_*: nominal $ trillions
      g_*: percent of GDP
      s_*: percent of total revenue
    fields:
      ii: individual income tax
      pr: payroll taxes
      ci: corporate income tax
      ex: excise taxes
      cu: customs duties
      eg: estate and gift taxes
      mi: miscellaneous
      tot: total revenue
    notes:
    - 'Replaces the FY1995-vs-FY2025 two-point comparison with the full annual series. The endpoint
      figures are unchanged: FY1995 $1.352T / 17.88% of GDP, FY2025 $5.235T / 17.24% of GDP.'
    - 'Customs duties are the outlier: $19B to $195B, 0.26% to 0.64% of GDP.'
    - This is FEDERAL revenue only. Do not compare it to the OECD 25.6% figure, which counts federal,
      state and local. See the oecd output.
  income_tax_by_group:
    title: Share of federal individual income tax paid, by income group
    source: IRS Statistics of Income, individual tables by tax rate and income percentile, tax year
      2023. CBO Distribution of Household Income 2022 for the top 1% income share
    notes:
    - INDIVIDUAL INCOME TAX ONLY. Excludes payroll tax, which is where most households below the
      top decile pay more. Any chart must say this.
    - Refundable credits are excluded from the IRS series, which overstates the effective rate at
      the bottom.
    - Tax year 2023 is the latest IRS year. The 1995 comparison point was not retrieved; 2001 (33.2%)
      is the earliest verified anchor.
    - Concentration of tax paid tracks concentration of income. Show both columns or the chart misleads.
  income_inequality:
    title: Real median household income {mhi[start]}-{mhi[end]}, family Gini index
      {gini[start]}-{gini[end]} and top statutory marginal rate {top[start]}-{top[end]}
    source: 'Census Bureau via FRED: MEHOINUSA672N (income), GINIALLRF (Gini). Statutory rate schedules'
    units:
      mhi: real median household income, 2024 dollars
      gini: family Gini index, ratio
      top: top statutory marginal individual income tax rate, percent
    notes:
    - Gini is for FAMILIES, not households. The household series runs higher (~0.47-0.49). Label
      it on any chart.
    - Top rate is statutory, not effective. 1995 39.6%, 2003 35%, 2013 39.6%, 2018 37%.
    - Median income +28.1% over 29 years, 0.86% a year.
  oecd:
    title: Total tax revenue as a share of GDP, OECD comparison
    source: OECD Revenue Statistics 2025, United States country note, 2024 preliminary data
    notes:
    - 'This counts ALL levels of government: federal, state and local. That is why 25.6% is higher
      than the 17.2% federal-only figure from CBO. The two are not interchangeable and any chart
      must say which it uses.'
    - US peak was 28.3% in 2000; low was 22.9% in 2009.
    - The US is the only OECD member with no value-added tax, which accounts for most of the gap.
    - 2024 is the latest OECD year. It breaks the 1995/2025 convention used elsewhere; say so.
  economy:
    title: US macroeconomic series, FY{start} onward
    source: CBO Historical Economic Data, February 2026 vintage
    units:
      gdp: nominal $ trillions
      rgdp: real $ trillions, FY2025 chained
      potential_rgdp: real $ trillions, FY2025 chained
      output_gap: percent of potential GDP
      unemp: percent
      nairu: percent
      lfpr: percent of civilian population 16+
      cpi: index
      chained_cpiu: index
      core_cpiu: index
      core_pce: index
      gdp_deflator: index, FY2025 = 100
      ff: percent
      t10: percent
      t3m: percent
      prod: output per hour, nonfarm business, index
      wage_share: wages and salaries as percent of GDP
      profit_share: corporate profits as percent of GDP
    notes:
    - THIS FILE CONTAINS PROJECTIONS. CBO publishes actuals and baseline projections in one series
      running to FY2036. _meta.estimate_boundary gives the last ACTUAL fiscal year. No chart may
      draw actual and projected values as one continuous line.
    - Fiscal years, not calendar years. FY2025 ran October 2024 to September 2025.
    - wage_share and profit_share are shares of GDP, not of national income, so they do not sum to
      100 with anything. They are comparable to each other over time, not to a factor-share decomposition.
    - The GDP deflator here is the series used to deflate every nominal dollar figure elsewhere on
      the site, rebased so FY2025 = 100.
    - cpi, chained_cpiu, core_cpiu and core_pce are INDEX LEVELS, not inflation rates. A rate is a
      year-over-year change computed from them; nothing here is pre-differenced.
    - The price series start in different years, and the gap before each start is null, never zero.
      core_cpiu begins FY1958 and chained_cpiu begins FY2002 (CBO does not carry the chained CPI-U
      before then). Each is on its own base, so levels are comparable within a series over time,
      never across two of them.
  bracket_history:
    title: Statutory federal income tax bracket schedules, {start}-{end}
    source: Tax Foundation income-tax-rates dataset (1913-2019, from IRS SOI Historical Table 23
      and IRS Revenue Procedures); IRS Revenue Procedures 2018-57 through 2024-40 (2019-2025,
      curated); IRS SOI Historical Table 23 / Tax Policy Center for the published top rate;
      FRED CPIAUCNS for the constant-dollar deflator
    units:
      s.*.r: percent
      s.*.lo, s.*.hi: nominal dollars
      s.*.rlo, s.*.rhi: constant 2024 dollars
      top, sched_top: percent
    fields:
      y: tax year
      top: top marginal rate as published (IRS SOI / Tax Policy Center)
      sched_top: top marginal rate on the raw bracket schedule ladder (single filer)
      adj: non-null only in the twelve years where top and sched_top disagree
      nb: bracket count on the single-filer schedule
      s: brackets per filing status (single, mfj, mfs, hoh), null before that status existed
    notes:
    - Statutory is not effective. Nobody pays the top rate on their whole income, and the
      threshold it applies at has moved enormously.
    - 'Twelve years diverge between the published top rate and the schedule ladder top: 1923,
      1929, 1940, 1946, 1947, 1948, 1949, 1950, 1968, 1969, 1970, 1981. Each carries a documented
      `adj` entry; see curated/bracket_adjustments.yaml.'
    - mfj and mfs schedules do not exist before 1949; hoh does not exist before 1952. These are
      null, never a back-projected copy of the single schedule.
    - Excludes the alternative minimum tax, the phase-out of exemptions and deductions, and the
      3.8% net investment income tax from 2013.
  cbo_effective_rates:
    title: Average federal tax rate by income group, published anchor years 1979-2022
    source: CBO, The Distribution of Household Income, 2022 (January 2026), Supplemental Data
      Table 9, Average Federal Tax Rates by Income Group, 1979 to 2022
    units:
      v.*: percent of income before means-tested transfers and federal taxes
    fields:
      lowest: lowest income quintile
      second: second income quintile
      middle: middle income quintile
      fourth: fourth income quintile
      highest: highest income quintile
      top1: top 1 percent
    notes:
    - INCLUDES PAYROLL TAX, corporate income tax and excise tax, not individual income tax alone.
      This is why it cannot be compared to the income-tax-only shares in income_tax_by_group.
    - These are PUBLISHED ANCHOR YEARS, not an annual series. Never draw a connecting line between
      them; the years in between were not observed by this table.
    - The lowest quintile's average rate fell to near zero (0.6% in 2019, 1.4% in 2022) as
      refundable credits grew; it was 9.3% in 1979.
  party_splits:
    title: Counted per-party roll-call splits for {laws} major deficit-moving laws,
      {start:.4}-{end:.4}
    source: 'Voteview (voteview.com/data): HSall_members.csv joined to per-congress roll-call and
      vote files. Final-passage roll call per law curated by hand. PL 115-97 cross-checked against
      House Clerk roll call 699.'
    notes:
    - These splits are COUNTED, not classified. This replaces the earlier PLR/PLD/XP classification
      derived from published vote character, which SOURCES.md flagged as the dataset's weakest point.
    - A null chamber means no roll call exists, almost always a voice vote. The CARES Act passed
      the House this way. Absence of a roll call is NOT unanimity and must never be rendered as a
      vote.
    - Independents and third-party members are counted separately as "i", never folded into a major
      party.
    - The vote counted is FINAL PASSAGE. Procedural votes, cloture and motions to recommit are excluded,
      and a bill often has several of each.
  states_balance:
    title: What each state gives the federal government and gets back, by IRS gross collections
      against USASpending award spending
    source: IRS Statistics of Income, SOI Data Book Table 5, Gross Collections by Type of Tax and
      State (vintage discovered per run); USASpending.gov spending_by_geography, place of performance
      basis, same fiscal year window as the IRS vintage
    units:
      give_b: federal tax gross collections, $ billions
      get_b: federal award spending, $ billions
      pop: population (from USASpending)
      give_pc: give_b per person, $
      get_pc: get_b per person, $ (USASpending's own per_capita figure)
      balance_b: get_b minus give_b, $ billions
      balance_pc: get_pc minus give_pc, $ per person
      ratio: get_b / give_b
    fields:
      code: two-letter postal code
      is_state: true ONLY for the 50 actual states; false for DC (excluded from the colour-scale
        domain) and for territories
      in_grid: whether the jurisdiction is drawn on the tile-grid cartogram (states + DC only)
    notes:
    - THIS IS NOT A BALANCE OF PAYMENTS. Give is gross collections classified by the filer's
      address (IRS Table 5's own note); get is award spending classified by place of PERFORMANCE,
      not the recipient's residence. A border employer's withholding can be booked to a
      neighbouring state; a military base or federal retiree's former duty station pulls spending
      away from where the money is actually used. State this in body copy, never a tooltip.
    - Award spending EXCLUDES most direct benefit payments (Social Security, Medicare, SNAP), so
      the "get" side understates what a state actually receives. Gross collections include
      penalties and interest and exclude excise taxes collected by Customs and the Alcohol and
      Tobacco Tax and Trade Bureau.
    - DC is not a state, is an extreme outlier by construction (federal employment concentration),
      and is excluded from the colour-scale domain so it does not flatten the 50-state range. It
      is still drawn and still in the table.
    - Territories (PR, GU, VI, MP, AS) appear in USASpending but not in IRS Table 5's state
      breakdown; give_b is null for them, not zero. They are not drawn on the tile grid.
    - The Rockefeller Institute publishes an actual state balance-of-payments study; its series
      ends FY2022 and it is cited, never ingested (no machine-readable feed exists).
  states_tax_mix:
    title: State tax collections by category, as a share of each state's own total
    source: US Census Bureau, Annual Survey of State Government Tax Collections (STC), detailed
      table, transposed (vintage discovered per run)
    units:
      total_b: total state tax collections, $ billions
      shares: percent of that state's own total tax collections
    notes:
    - A category value of 'X' in the source means the state does NOT LEVY that tax (e.g. Alaska
      has no general sales tax). This is a fact, distinct from a genuinely missing figure, and is
      recorded in each jurisdiction's `not_levied` list rather than rendered as `0` or `no data`.
    - The source's US-total column excludes Washington DC regardless of whether DC has its own
      jurisdiction column; `_meta.coverage.stc_includes_dc` records which is actually true for the
      fetched vintage rather than assuming it.
    - The `other` category is derived as the state's total minus the four named categories, not a
      Census item code on its own.
